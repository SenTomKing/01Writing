server {
    listen 80;
    server_tokens off;
    # Docker 服务重建后地址可能变化，使用内置 DNS 定期重新解析。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $writing_api api:8000;
    root /usr/share/nginx/html;
    client_max_body_size 3m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'" always;
    location /api/ {
        proxy_pass http://$writing_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
    location /health { proxy_pass http://$writing_api; }
    location / { try_files $uri $uri/ /index.html; }
}
