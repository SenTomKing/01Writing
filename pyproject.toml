[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "01writing"
version = "4.0.0"
description = "一个带人工确认和修订记录的 AI 辅助写作工具"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "pydantic>=2.10,<3.0",
    "SQLAlchemy>=2.0,<2.1",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.2,<4",
    "celery[redis]>=5.5,<6",
    "argon2-cffi>=23,<26",
    "langgraph>=1.0,<2",
    "pypdf>=6.0,<7",
]

[project.optional-dependencies]
test = ["httpx2>=2.16,<3.0", "httpx>=0.28,<1", "pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1"]

[project.scripts]
writing-assistant = "writing_assistant.cli:main"
writing-api = "writing_server.cli:main"
writing-web = "writing_server.cli:main"

[tool.setuptools.packages.find]
where = ["src", "backend/src"]

[tool.setuptools.package-data]
"writing_assistant.storage.migrations" = ["script.py.mako"]

"writing_server" = ["migrations/*.py", "migrations/versions/*.py", "migrations/versions/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src", "backend/src"]
testpaths = ["tests", "backend/tests"]

[tool.ruff]
line-length = 120
